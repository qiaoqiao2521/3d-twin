<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>汽车解剖 · 交互图谱</title><link rel="stylesheet" href="./style.css"></head><body><div class="app">
<header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"><span></span><span></span><span></span></div><div><strong>汽车解剖</strong><small>INTERACTIVE ATLAS</small></div></div><div class="top-copy"><span>结构与运动</span><i></i><span>交互图谱</span></div><button class="focus-button" id="focus" type="button" aria-pressed="false">放大观察</button><a class="source-link" id="open-source" href="./auto-atlas/index.html" target="_blank" rel="noopener noreferrer">打开完整页面 ↗</a></header>
<div class="body"><aside class="rail"><div class="rail-head"><span>探索视图</span><small>选一个视角，深入观察</small></div><nav aria-label="图谱视图">
<button class="nav-item active" data-view="vehicle" aria-current="page"><span class="nav-icon">◫</span><span><strong>整车结构</strong><small>车型 · 分件 · 拆解</small></span><b>↗</b></button><button class="nav-item" data-view="engine"><span class="nav-icon">◉</span><span><strong>发动机运转</strong><small>V8 · 剖面 · 四冲程</small></span><b>↗</b></button><button class="nav-item" data-view="systems"><span class="nav-icon">⌘</span><span><strong>汽车系统</strong><small>动力 · 传动 · 制动</small></span><b>↗</b></button>
</nav><section class="knowledge"><h2>部件目录</h2><div class="catalog-body"><label>查看方式<select id="catalog-mode"><option value="systems">功能系统</option><option value="structure">物理装配</option></select></label><select id="system-filter" aria-label="功能系统"><option value="">全部系统</option></select><input id="catalog-search" type="search" aria-label="查找目录部件" placeholder="查找部件"><div id="catalog-list"></div></div></section></aside>
<main class="workspace"><div class="stage-head"><div><div class="stage-kicker" id="eyebrow">整车结构</div><h1 id="heading">拆开一辆车，看看每个部件</h1><p id="description">切换车型、选择部件，或拖动爆炸滑块展开整车。</p></div><div class="stage-meta"><span class="status-dot"></span><span id="availability">本地部署</span></div></div>

<details class="controller" id="controller-panel" hidden><summary>发动机统一控制 <span id="controller-summary"></span></summary><div class="transport"><button data-transport="play">播放</button><button data-transport="pause">暂停</button><button data-transport="reset">相位复位</button><label>播放倍率<select id="transport-speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><div id="controller-controls"></div></details><p class="notice" id="atlas-status" role="status">正在读取目录…</p>
